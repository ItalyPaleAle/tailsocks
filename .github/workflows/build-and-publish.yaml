name: Build and publish

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          # Do not cache in release workflows
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Do not cache in release workflows
          cache-binary: false

      # Lowercase REPO_OWNER which is required for containers
      - name: Set lowercase REPO_OWNER
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          echo "REPO_OWNER=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Generate container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/tailsocks
          # generate semver tags and 'latest' tag
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set variables
        run: |
          BUILD_ID=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          COMMIT_HASH=$(echo "${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}" | head -c 7)

          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

          echo "BUILD_ID: '$BUILD_ID'"
          echo "BUILD_VERSION: '$BUILD_VERSION'"
          echo "BUILD_DATE: '$BUILD_DATE'"
          echo "COMMIT_HASH: '$COMMIT_HASH'"

          BUILDINFO_PKG="github.com/italypaleale/tailsocks/buildinfo"
          BUILD_LDFLAGS="-X ${BUILDINFO_PKG}.Production=1 -X ${BUILDINFO_PKG}.AppVersion=${BUILD_VERSION} -X ${BUILDINFO_PKG}.BuildId=${BUILD_ID} -X ${BUILDINFO_PKG}.BuildDate=${BUILD_DATE} -X ${BUILDINFO_PKG}.CommitHash=${COMMIT_HASH} -buildid=${BUILD_ID}"

          echo "BUILD_LDFLAGS=$BUILD_LDFLAGS" >> $GITHUB_ENV

          echo "BUILD_LDFLAGS: '$BUILD_LDFLAGS'"

      - name: Login to container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux-amd64 linux-arm64 linux-armv7 macos-x64 macos-arm64 windows-x64 windows-arm64 freebsd-amd64 freebsd-arm64; do
            ./scripts/build-binaries.sh "${target}"
          done

          echo -e "\n###\nLinks for Docker buildx\n"
          (
            cd .bin && \
            ln -v -s tailsocks-${{ env.BUILD_ID }}-linux-amd64 linux-amd64 && \
            ln -v -s tailsocks-${{ env.BUILD_ID }}-linux-arm64 linux-arm64 && \
            ln -v -s tailsocks-${{ env.BUILD_ID }}-linux-armv7 linux-arm \
          )

          echo -e "\n###\nCompilation done\n"
          echo ".bin:"
          ls -al .bin
          echo ".out:"
          ls -al .out

      - name: Generate checksums
        working-directory: .out
        run: |
          shopt -s nullglob
          files=(tailsocks-*.tar.gz tailsocks-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No release archives found in .out"
            exit 1
          fi

          sha256sum "${files[@]}" | sort -k 2 > checksums.txt

          echo "checksums.txt:"
          cat checksums.txt

      - name: Build and push Container images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: docker-build-push
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          context: .
          file: Dockerfile
          push: true

      # A single attestation covering every file attached to the release: the archives plus checksums.txt
      - name: Attestation for release archives
        id: attest-archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: '.out/*'

      # Attached to the release so the provenance can also be verified offline, with `gh attestation verify <archive> --bundle attestations.json`
      - name: Stage attestation bundle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLE_PATH: ${{ steps.attest-archives.outputs.bundle-path }}
        run: |
          cp "${BUNDLE_PATH}" .out/attestations.json

          echo "Attestations: $(wc -l < .out/attestations.json)"

      - name: Publish binaries as Actions Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts
          path: .out
          include-hidden-files: true
          compression-level: 0

      - name: Container image attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/tailsocks'
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the tag so its annotation message is available for release notes
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts
          path: .out

      - name: Publish release
        run: |
          # Published releases are immutable: re-running the workflow on the same tag must fail, not overwrite
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists, and published releases are immutable"
            exit 1
          fi

          # Tags carrying a pre-release identifier (such as v1.2.0-rc.1) are marked as pre-releases
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            echo "Marking ${TAG} as a pre-release"
            prerelease=(--prerelease)
          fi

          # An annotated tag carries a message; use it as the release notes.
          # A lightweight tag has no message, so fall back to auto-generated notes.
          # Strip any Git signature block from the tag message so it doesn't leak into the release notes.
          notes_args=()
          tag_type=$(git tag -l --format='%(objecttype)' "${TAG}")
          if [[ "${tag_type}" == "tag" ]]; then
            tag_message=$(git tag -l --format='%(contents)' "${TAG}")
            tag_signature=$(git tag -l --format='%(contents:signature)' "${TAG}")
            if [[ -n "${tag_signature}" && "${tag_message}" == *"${tag_signature}" ]]; then
              tag_message="${tag_message%"${tag_signature}"}"
            fi
            if [[ -n "${tag_message}" ]]; then
              echo "Using tag annotation as release notes"
              notes_args=(--notes "${tag_message}")
            fi
          fi
          if [[ ${#notes_args[@]} -eq 0 ]]; then
            echo "Tag has no annotation; auto-generating release notes"
            notes_args=(--generate-notes)
          fi

          shopt -s nullglob
          assets=(.out/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No assets found in .out"
            exit 1
          fi

          echo "Attaching ${#assets[@]} assets:"
          printf '  %s\n' "${assets[@]}"

          # Never pass --draft: the release is published immediately, with no approval step
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            "${prerelease[@]}" \
            "${notes_args[@]}" \
            "${assets[@]}"

      - name: Job summary
        run: |
          url=$(gh release view "${TAG}" --json url --jq '.url')
          {
            echo "## Release ${TAG}"
            echo
            echo "Published: <${url}>"
          } >> "${GITHUB_STEP_SUMMARY}"
